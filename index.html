<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intermedios">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Calculadora de intermedios</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202b;--mute:#5d6b79;--line:#d3dae1;--acc:#1f3a5f;--acc-ink:#fff;--bad:#a4322a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e8edf2;--mute:#93a1af;--line:#2b3744;--acc:#7fa9dd;--acc-ink:#0d1620;--bad:#f08a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:17px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.del{color:var(--bad)}
button:disabled{opacity:.35;cursor:default}
.ing{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.sm{flex:0 0 96px}
.row>.x{flex:0 0 44px;padding:0}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{font-size:14px;color:var(--mute);font-weight:500}
td.q{font-weight:700;font-size:19px}
tr.tot td{border-bottom:0;font-weight:700}
.empty{color:var(--mute);text-align:center;padding:18px 8px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;border-radius:0;min-height:56px;color:var(--mute)}
nav button[aria-current=page]{color:var(--acc);font-weight:700}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
.list-item .t{flex:1}
.list-item small{display:block;color:var(--mute)}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button id="nav-calc" onclick="go('calc')">Calcular</button>
  <button id="nav-rec" onclick="go('rec')">Recetas</button>
</nav>
<script>
const KEY = 'intermedios.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; };

let data = load();
let view = 'calc';
let calc = { rid: data.recipes[0]?.id || '', mode: 'total', ing: 0, amount: '', unit: 'kg' };
let edit = null; // receta en edición

function migrate(d) {
  d.recipes.forEach(r => {
    if (r.base) { // formato antiguo: % sobre ingrediente base
      const all = [{ n: r.base, p: 100 }, ...r.items];
      const t = all.reduce((a, i) => a + i.p, 0);
      r.items = all.map(i => ({ n: i.n, p: Math.round(i.p / t * 10000) / 100 }));
      delete r.base;
    }
  });
  return d;
}
const sumOf = r => r.items.reduce((a, i) => a + i.p, 0);
const pct = n => n.toLocaleString('es-ES', { maximumFractionDigits: 2 });
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.recipes)) return migrate(d); } catch (e) {}
  return { recipes: [] };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert('No se ha podido guardar en este dispositivo.'); }
}
function go(v) { view = v; edit = null; render(); window.scrollTo(0, 0); }

function fmt(grams, unit) {
  const v = unit === 'kg' ? grams / 1000 : grams;
  const dec = unit === 'kg' ? 3 : 1;
  return v.toLocaleString('es-ES', { maximumFractionDigits: dec }) + ' ' + unit;
}

/* ---------- Calcular ---------- */
function renderCalc() {
  const rs = data.recipes;
  if (!rs.length) {
    return `<h1>Calcular</h1><div class="card empty">Aún no hay recetas. Añade la primera en la pestaña Recetas.</div>`;
  }
  const r = rs.find(x => x.id === calc.rid) || rs[0];
  calc.rid = r.id;
  const items = r.items;
  if (calc.ing >= items.length) calc.ing = 0;
  const sumP = items.reduce((a, i) => a + i.p, 0);

  let out = '';
  const a = num(calc.amount);
  if (a > 0) {
    const f = calc.unit === 'kg' ? 1000 : 1;
    const grams = a * f;
    const totG = calc.mode === 'total' ? grams : grams * 100 / items[calc.ing].p;
    out = `<div class="card"><table>
      <tr><th>Ingrediente</th><th>%</th><th>Cantidad</th></tr>
      ${items.map(i => `<tr><td>${esc(i.n)}</td><td>${pct(i.p)}</td><td class="q">${fmt(totG * i.p / 100, calc.unit)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td>${pct(sumP)}</td><td>${fmt(totG * sumP / 100, calc.unit)}</td></tr>
    </table>${Math.abs(sumP - 100) > 0.1 ? `<div class="err" role="alert">Los porcentajes de esta receta suman ${pct(sumP)} %, no 100 %. Revisa la receta.</div>` : ''}</div>`;
  } else {
    out = `<div class="card empty">Escribe una cantidad para ver los ingredientes.</div>`;
  }

  return `<h1>Calcular</h1>
  <div class="card">
    <label for="c-rec">Preparación</label>
    <select id="c-rec" onchange="calc.rid=this.value;calc.ing=0;render()">
      ${rs.map(x => `<option value="${x.id}" ${x.id === r.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
    </select>
    <label>Calcular según</label>
    <div class="seg">
      <button aria-pressed="${calc.mode === 'total'}" onclick="calc.mode='total';render()">Total a fabricar</button>
      <button aria-pressed="${calc.mode === 'ing'}" onclick="calc.mode='ing';render()">Un ingrediente</button>
    </div>
    ${calc.mode === 'ing' ? `<label for="c-ing">Ingrediente que ya tengo</label>
    <select id="c-ing" onchange="calc.ing=+this.value;render()">
      ${items.map((i, k) => `<option value="${k}" ${k === calc.ing ? 'selected' : ''}>${esc(i.n)}</option>`).join('')}
    </select>` : ''}
    <label for="c-amt">${calc.mode === 'total' ? 'Cantidad total' : 'Cantidad de ese ingrediente'}</label>
    <div class="row">
      <input id="c-amt" inputmode="decimal" placeholder="0" value="${esc(calc.amount)}" oninput="calc.amount=this.value;renderResultOnly()">
      <select class="sm" onchange="calc.unit=this.value;render()" aria-label="Unidad">
        <option ${calc.unit === 'kg' ? 'selected' : ''}>kg</option><option ${calc.unit === 'g' ? 'selected' : ''}>g</option>
      </select>
    </div>
  </div>
  <div id="result">${out}</div>`;
}
// Actualiza solo el resultado para no perder el foco del teclado
function renderResultOnly() {
  const keep = $('#c-amt'); const pos = keep?.selectionStart;
  const tmp = document.createElement('div'); tmp.innerHTML = renderCalc();
  $('#result').innerHTML = tmp.querySelector('#result').innerHTML;
}

/* ---------- Recetas ---------- */
function renderRec() {
  if (edit) return renderEdit();
  const rs = data.recipes;
  return `<h1>Recetas</h1>
  <div class="card">
    ${rs.length ? rs.map(r => `<div class="list-item"><div class="t">${esc(r.name)}<small>${r.items.length} ingredientes · suma ${pct(sumOf(r))} %</small></div>
      <button onclick="startEdit('${r.id}')">Editar</button></div>`).join('') : '<div class="empty">No hay recetas todavía.</div>'}
    <div style="margin-top:12px"><button class="main" style="width:100%" onclick="startEdit()">Nueva receta</button></div>
  </div>
  <div class="card">
    <strong>Copia de seguridad</strong>
    <p style="color:var(--mute);font-size:15px;margin:6px 0 12px">Guarda un archivo en iCloud Drive para no perder tus recetas.</p>
    <div class="row"><button onclick="exportData()">Exportar</button>
    <button onclick="$('#imp').click()">Importar</button></div>
    <input id="imp" type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])">
  </div>`;
}

function startEdit(id) {
  const r = data.recipes.find(x => x.id === id);
  edit = r ? JSON.parse(JSON.stringify(r)) : { id: '', name: '', items: [{ n: '', p: '' }, { n: '', p: '' }] };
  edit.isNew = !r; edit.err = '';
  render();
}
function moveIng(k, d) {
  const j = k + d, a = edit.items;
  if (j < 0 || j >= a.length) return;
  [a[k], a[j]] = [a[j], a[k]];
  render();
}
function updSum() {
  const el = $('#e-sum'); if (!el || !edit) return;
  const t = edit.items.reduce((a, i) => a + (num(i.p) || 0), 0);
  el.textContent = 'Suma: ' + pct(t) + ' %' + (Math.abs(t - 100) > 0.1 ? ' (debería sumar 100 %)' : '');
}
function renderEdit() {
  const e = edit;
  return `<h1>${e.isNew ? 'Nueva receta' : 'Editar receta'}</h1>
  <div class="card">
    <label for="e-name">Nombre de la preparación</label>
    <input id="e-name" value="${esc(e.name)}" oninput="edit.name=this.value">
    <label>Ingredientes (% sobre el total de la fabricación)</label>
    ${e.items.map((i, k) => `<div class="ing">
      <input aria-label="Ingrediente ${k + 1}" placeholder="Ingrediente" value="${esc(i.n)}" oninput="edit.items[${k}].n=this.value">
      <div class="row">
        <input aria-label="Porcentaje del ingrediente ${k + 1}" inputmode="decimal" placeholder="% del total" value="${esc(i.p)}" oninput="edit.items[${k}].p=this.value;updSum()">
        <button class="x" aria-label="Subir ingrediente ${k + 1}" ${k === 0 ? 'disabled' : ''} onclick="moveIng(${k},-1)">▲</button>
        <button class="x" aria-label="Bajar ingrediente ${k + 1}" ${k === e.items.length - 1 ? 'disabled' : ''} onclick="moveIng(${k},1)">▼</button>
        <button class="x del" aria-label="Quitar ingrediente ${k + 1}" onclick="edit.items.splice(${k},1);render()">✕</button>
      </div></div>`).join('')}
    <button onclick="edit.items.push({n:'',p:''});render()">Añadir ingrediente</button>
    <div id="e-sum" style="margin-top:10px;color:var(--mute);font-size:15px"></div>
    ${e.err ? `<div class="err" role="alert">${esc(e.err)}</div>` : ''}
  </div>
  <div class="row"><button onclick="go('rec')">Cancelar</button><button class="main" onclick="saveEdit()">Guardar receta</button></div>
  ${e.isNew ? '' : `<div style="margin-top:14px"><button class="del" style="width:100%" onclick="delRec()">Eliminar receta</button></div>`}`;
}
function saveEdit() {
  const e = edit;
  const items = e.items.filter(i => String(i.n).trim() || String(i.p).trim());
  if (!e.name.trim()) { e.err = 'Escribe el nombre de la preparación.'; return render(); }
  for (const i of items) {
    if (!String(i.n).trim() || !(num(i.p) > 0)) { e.err = 'Cada ingrediente necesita nombre y un porcentaje mayor que 0.'; return render(); }
  }
  if (!items.length) { e.err = 'Añade al menos un ingrediente.'; return render(); }
  const tot = items.reduce((a, i) => a + num(i.p), 0);
  if (Math.abs(tot - 100) > 0.1 && !confirm('Los porcentajes suman ' + pct(tot) + ' %, no 100 %. ¿Guardar igualmente?')) return;
  const rec = { id: e.id || 'r' + Date.now(), name: e.name.trim(), items: items.map(i => ({ n: String(i.n).trim(), p: num(i.p) })) };
  const k = data.recipes.findIndex(x => x.id === rec.id);
  if (k >= 0) data.recipes[k] = rec; else data.recipes.push(rec);
  save(); calc.rid = calc.rid || rec.id; go('rec');
}
function delRec() {
  if (!confirm('¿Eliminar «' + edit.name + '»? No se puede deshacer.')) return;
  data.recipes = data.recipes.filter(x => x.id !== edit.id);
  if (calc.rid === edit.id) calc.rid = data.recipes[0]?.id || '';
  save(); go('rec');
}

/* ---------- Copia de seguridad ---------- */
async function exportData() {
  const name = 'recetas-intermedios-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([JSON.stringify(data, null, 2)], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
}
function importData(f) {
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.recipes)) throw 0;
      if (!confirm('Esto sustituirá las ' + data.recipes.length + ' recetas actuales por las ' + d.recipes.length + ' del archivo. ¿Continuar?')) return;
      data = migrate({ recipes: d.recipes }); calc.rid = data.recipes[0]?.id || ''; save(); render();
    } catch (e) { alert('El archivo no es una copia válida de recetas.'); }
  };
  rd.readAsText(f);
}

/* ---------- Arranque ---------- */
function render() {
  $('#app').innerHTML = view === 'calc' ? renderCalc() : renderRec();
  updSum();
  $('#nav-calc').setAttribute('aria-current', view === 'calc' ? 'page' : 'false');
  $('#nav-rec').setAttribute('aria-current', view === 'rec' ? 'page' : 'false');
}
render();
if (navigator.storage?.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
